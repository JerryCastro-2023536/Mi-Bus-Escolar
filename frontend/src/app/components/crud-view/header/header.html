<div class="crud-header">

    <div class="title-row">
        <div>
            <h1>{{ title() }}</h1>
            @if (subtitle()) {
                <p class="subtitle">{{ subtitle() }}</p>
            }
        </div>

        <button class="btn-primary" (click)="onCreateClick()">
            + Nuevo registro
        </button>
    </div>

    @if (kpis().length) {
        <div class="kpi-row">
            @for (kpi of kpis(); track kpi.valueKey) {
                <div class="kpi-card">
                    <span class="kpi-title">{{ kpi.title }}</span>
                    <span class="kpi-value">{{ kpiData()[kpi.valueKey] ?? '—' }}</span>
                    @if (kpi.subtitle) {
                        <span class="kpi-subtitle">{{ kpi.subtitle }}</span>
                    }
                </div>
            }
        </div>
    }

    <div class="search-row">
        <input type="text" placeholder="Buscar..." [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" />
    </div>

</div>
