<div class="contenedor-principal">
  <h2>Gestión de Ubicación (Admin / Usuario)</h2>

  <!-- Componente Mapa reutilizable -->
  <app-mapa 
    [rol]="'admin'" 
    [puntoSeleccionado]="coordenadaActual"
    (cambioUbicacion)="onUbicacionCambiada($event)">
  </app-mapa>

  <!-- Panel de control de datos -->
  <div class="panel-coordenadas">
    <h3>Coordenada Seleccionada</h3>
    <p><strong>Latitud:</strong> {{ coordenadaActual.lat }}</p>
    <p><strong>Longitud:</strong> {{ coordenadaActual.lng }}</p>

    <button (click)="guardarCoordenada()" class="btn-guardar">
      Guardar Punto en Backend
    </button>
  </div>
</div>
